{% extends "layout.html" %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card p-4 shadow-lg" style="min-width: 350px; max-width: 400px; width: 100%; background-color: #2a2a40; border: none;">
        <h3 class="text-center text-info mb-4">Login to SnapNote</h3>

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                {{ form.username.label_tag }}
                {{ form.username }}
            </div>
            <div class="mb-3">
                {{ form.password.label_tag }}
                {{ form.password }}
            </div>
            <button class="btn btn-primary w-100">Login</button>
        </form>

        <p class="mt-3 text-center text-light">
            Don't have an account? 
            <a href="{% url 'register' %}" class="text-info">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
